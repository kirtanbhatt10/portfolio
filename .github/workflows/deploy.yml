name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test demo logic
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Check every page was exported
        run: |
          for page in index.html 404.html work/index.html about/index.html lab/index.html contact/index.html \
                      work/promptshield/index.html work/headerhawk/index.html work/cybersec-arsenal/index.html \
                      work/undertone/index.html work/sentinel/index.html work/zenny/index.html \
                      work/sugam/index.html work/solaris/index.html work/codesec/index.html sentinel.html; do
            test -s "out/$page" || { echo "missing out/$page"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
